# TOTEM layout — num-row fork of the reconstructed Ergogen config
# Base: ergogen/totem.yaml (PCB-measured). Docs: https://docs.ergogen.xyz/
#
# Changes vs stock reconstruction:
#   - finger columns gain a `num` row above top (bottom → home → top → num)
#   - stretch key shifted up 1u along its 10° column axis (pinky column stays put)
#
# Import into the Ergogen web UI, or run:
#   ergogen totem-num.yaml -o output

meta:
  engine: 4.1.0
  name: TOTEM
  version: "0.3-num-row"
  reference: https://github.com/GEIGEIGEIST/TOTEM

units:
  cx: 18
  cy: 17
  kx: cx - 1
  ky: cy - 1
  # 1u along column at +10° (local [0, cy] → world). Hardcoded: mathjs sin() is radians.
  pinky_up_x: -2.952
  pinky_up_y: 16.742

points:
  key:
    padding: cy
    spread: cx
    width: kx
    height: ky
    name: "{{zone.name}}_{{row}}"
    tags:
      key: true

  zones:
    # Rows build bottom → home → top → num

    pinky:
      anchor:
        shift: [50.255, -113.481]
        rotate: 10
      rows:
        bottom:
        home:
        top:
        num:
      key.tags.finger: true

    ring:
      anchor:
        shift: [66.903, -98.364]
        rotate: 4
      rows:
        bottom:
        home:
        top:
        num:
      key.tags.finger: true

    middle:
      anchor:
        shift: [85.129, -88.168]
      rows:
        bottom:
        home:
        top:
        num:
      key.tags.finger: true

    index:
      anchor:
        shift: [103.129, -96.605]
      rows:
        bottom:
        home:
        top:
        num:
      key.tags.finger: true

    inner:
      anchor:
        shift: [121.129, -99.325]
      rows:
        bottom:
        home:
        top:
        num:
      key.tags.finger: true

    # Outer pinky stretch — raised 1u along r=10
    stretch:
      anchor:
        shift: [31.153 + pinky_up_x, -109.089 + pinky_up_y]
        rotate: 10
      key.tags:
        finger: true
        stretch: true

    thumb_near:
      anchor:
        shift: [98.103, -117.314]
      key.tags.thumb: true

    thumb_home:
      anchor:
        shift: [118.028, -120.089]
        rotate: -15
      key.tags.thumb: true

    thumb_far:
      anchor:
        shift: [136.478, -127.764]
        rotate: -30
      key.tags.thumb: true

  mirror: 149.952

outlines:
  _keys:
    - what: rectangle
      where: true
      size: [kx, ky]
      bound: false

  board:
    - what: rectangle
      where: true
      size: [cx, cy]
      bound: true
      expand: 1.5
      joints: 1

  demo:
    - "^board"
    - "^_keys"
